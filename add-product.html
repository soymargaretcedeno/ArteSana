<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/ArteSana_logo.png">
    <title>Add Product - ArteSana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .add-product-container {
            background: var(--light-bg, #FEFAE0);
            min-height: 100vh;
            padding: 2rem 0;
        }
        
        .add-product-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .add-product-title {
            font-family: 'Playfair Display', serif;
            color: #a22a22;
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .add-product-subtitle {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        
        .product-form-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 8px 32px rgba(162,42,34,0.15);
            margin-bottom: 2rem;
        }
        
        .form-section {
            margin-bottom: 2rem;
        }
        
        .section-title {
            font-family: 'Playfair Display', serif;
            color: #a22a22;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #f8f6ee;
            padding-bottom: 0.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .form-control {
            border: 2px solid #f8f6ee;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #a22a22;
            box-shadow: 0 0 0 0.2rem rgba(162,42,34,0.25);
        }
        
        .form-select {
            border: 2px solid #f8f6ee;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-select:focus {
            border-color: #a22a22;
            box-shadow: 0 0 0 0.2rem rgba(162,42,34,0.25);
        }
        
        .image-upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            background: #f8f6ee;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .image-upload-area:hover {
            border-color: #a22a22;
            background: #fcf7de;
        }
        
        .image-upload-area.dragover {
            border-color: #a22a22;
            background: #fcf7de;
        }
        
        .upload-icon {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 1rem;
        }
        
        .upload-text {
            color: #666;
            font-size: 1.1rem;
        }
        
        .preview-images {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .preview-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #f8f6ee;
        }
        
        .tag-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .tag {
            background: #a22a22;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .tag-remove {
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-primary {
            background: #800000;
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #600000;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(128,0,0,0.3);
        }
        
        .btn-outline {
            border: 2px solid #800000;
            color: #800000;
            background: transparent;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        .btn-outline:hover {
            background: #800000;
            color: white;
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #28a745;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #dc3545;
        }
        
        @media (max-width: 768px) {
            .product-form-card {
                padding: 2rem;
                margin: 0 1rem;
            }
            
            .add-product-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <script src="js/local-database.js"></script>
    <script src="js/products-database.js"></script>
    <script src="js/user-products-database.js"></script>
    <script src="js/i18n.js"></script>
    <script src="components/header-component.js"></script>
    <script src="components/header-user-component.js"></script>
    <script>window.renderHeader();</script>

    <div class="add-product-container">
        <div class="container">
            <div class="add-product-header">
                <h1 class="add-product-title">Add New Product</h1>
                <p class="add-product-subtitle">Share your handcrafted treasures with the ArteSana community</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="product-form-card" data-aos="fade-up">
                        <form id="addProductForm">
                            <div id="formMessages"></div>
                            
                            <!-- Basic Information -->
                            <div class="form-section">
                                <h3 class="section-title">
                                    <i class="fas fa-info-circle"></i> Basic Information
                                </h3>
                                
                                <div class="row">
                                    <div class="col-md-8">
                                        <div class="form-group">
                                            <label for="productName" class="form-label">Product Name *</label>
                                            <input type="text" class="form-control" id="productName" required>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="productCategory" class="form-label">Category *</label>
                                            <select class="form-select" id="productCategory" required>
                                                <option value="">Select Category</option>
                                                <option value="textiles">Textiles</option>
                                                <option value="jewelry">Jewelry</option>
                                                <option value="ceramics">Ceramics</option>
                                                <option value="sculpture">Sculpture</option>
                                                <option value="woodwork">Woodwork</option>
                                                <option value="leather">Leather</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label for="productDescription" class="form-label">Description *</label>
                                    <textarea class="form-control" id="productDescription" rows="4" required 
                                              placeholder="Describe your product, its materials, techniques used, and cultural significance..."></textarea>
                                </div>
                            </div>

                            <!-- Pricing -->
                            <div class="form-section">
                                <h3 class="section-title">
                                    <i class="fas fa-dollar-sign"></i> Pricing
                                </h3>
                                
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="productPrice" class="form-label">Price (USD) *</label>
                                            <input type="number" class="form-control" id="productPrice" min="0" step="0.01" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="originalPrice" class="form-label">Original Price (USD)</label>
                                            <input type="number" class="form-control" id="originalPrice" min="0" step="0.01" 
                                                   placeholder="Leave empty if no discount">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="productStock" class="form-label">Stock Quantity *</label>
                                            <input type="number" class="form-control" id="productStock" min="0" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="productWeight" class="form-label">Weight (kg) *</label>
                                            <input type="number" class="form-control" id="productWeight" min="0" step="0.1" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Product Details -->
                            <div class="form-section">
                                <h3 class="section-title">
                                    <i class="fas fa-cogs"></i> Product Details
                                </h3>
                                
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="productDimensions" class="form-label">Dimensions *</label>
                                            <input type="text" class="form-control" id="productDimensions" 
                                                   placeholder="e.g., 25cm x 20cm x 15cm" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="productMaterials" class="form-label">Materials *</label>
                                            <input type="text" class="form-control" id="productMaterials" 
                                                   placeholder="e.g., Cotton, Beads, Wood" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label for="productTags" class="form-label">Tags</label>
                                    <input type="text" class="form-control" id="productTags" 
                                           placeholder="Add tags separated by commas (e.g., traditional, handmade, cultural)">
                                    <div class="tag-input-container" id="tagContainer"></div>
                                </div>
                            </div>

                            <!-- Images -->
                            <div class="form-section">
                                <h3 class="section-title">
                                    <i class="fas fa-images"></i> Product Images
                                </h3>
                                
                                <div class="form-group">
                                    <label class="form-label">Main Image *</label>
                                    <div class="image-upload-area" id="mainImageUpload">
                                        <div class="upload-icon">
                                            <i class="fas fa-cloud-upload-alt"></i>
                                        </div>
                                        <div class="upload-text">Click to upload or drag and drop</div>
                                        <input type="file" id="mainImageInput" accept="image/*" style="display: none;" required>
                                    </div>
                                    <div id="mainImagePreview"></div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">Additional Images</label>
                                    <div class="image-upload-area" id="additionalImagesUpload">
                                        <div class="upload-icon">
                                            <i class="fas fa-images"></i>
                                        </div>
                                        <div class="upload-text">Click to upload multiple images</div>
                                        <input type="file" id="additionalImagesInput" accept="image/*" multiple style="display: none;">
                                    </div>
                                    <div class="preview-images" id="additionalImagesPreview"></div>
                                </div>
                            </div>

                            <!-- Artisan Information -->
                            <div class="form-section">
                                <h3 class="section-title">
                                    <i class="fas fa-user"></i> Artisan Information
                                </h3>
                                
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="artisanName" class="form-label">Artisan Name *</label>
                                            <input type="text" class="form-control" id="artisanName" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="artisanLocation" class="form-label">Location *</label>
                                            <input type="text" class="form-control" id="artisanLocation" 
                                                   placeholder="e.g., Guna Yala, Panama" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="storeName" class="form-label">Store Name</label>
                                            <input type="text" class="form-control" id="storeName" 
                                                   placeholder="e.g., Ana's Handcrafts">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="artisanAvatar" class="form-label">Artisan Avatar</label>
                                            <input type="url" class="form-control" id="artisanAvatar" 
                                                   placeholder="URL to artisan's photo">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Buttons -->
                            <div class="d-flex gap-3 justify-content-center">
                                <button type="button" class="btn btn-outline" onclick="resetForm()">
                                    <i class="fas fa-undo"></i> Reset Form
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-plus"></i> Add Product
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer-component></footer-component>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="components/footer-component.js"></script>
    <script src="components/auth-modal.js"></script>
    <auth-modal></auth-modal>
    
    <script>
        // Initialize AOS
        AOS.init({
            duration: 800,
            once: true
        });

        // Form handling
        document.addEventListener('DOMContentLoaded', function() {
            setupFormHandlers();
            setupImageUploads();
            setupTagInput();
        });

        // Setup form handlers
        function setupFormHandlers() {
            const form = document.getElementById('addProductForm');
            form.addEventListener('submit', handleFormSubmit);
        }

        // Handle form submission
        function handleFormSubmit(event) {
            event.preventDefault();
            
            const formData = collectFormData();
            if (!validateFormData(formData)) {
                return;
            }

            // Add product to database
            const newProduct = window.userProductsDB.addUserProduct(formData);
            
            if (newProduct) {
                showMessage('Product added successfully!', 'success');
                resetForm();
            } else {
                showMessage('Failed to add product. Please try again.', 'error');
            }
        }

        // Collect form data
        function collectFormData() {
            return {
                name: document.getElementById('productName').value,
                description: document.getElementById('productDescription').value,
                price: parseFloat(document.getElementById('productPrice').value),
                originalPrice: parseFloat(document.getElementById('originalPrice').value) || null,
                category: document.getElementById('productCategory').value,
                stock: parseInt(document.getElementById('productStock').value),
                weight: document.getElementById('productWeight').value,
                dimensions: document.getElementById('productDimensions').value,
                materials: document.getElementById('productMaterials').value.split(',').map(m => m.trim()),
                tags: getTags(),
                images: getImages(),
                mainImage: getMainImage(),
                artisan: {
                    name: document.getElementById('artisanName').value,
                    location: document.getElementById('artisanLocation').value,
                    store: document.getElementById('storeName').value || '',
                    avatar: document.getElementById('artisanAvatar').value || 'https://randomuser.me/api/portraits/women/1.jpg',
                    rating: 4.5
                },
                shipping: {
                    weight: parseFloat(document.getElementById('productWeight').value),
                    dimensions: document.getElementById('productDimensions').value,
                    estimatedDays: "5-7 business days"
                },
                rating: 0,
                reviews: 0,
                featured: false
            };
        }

        // Validate form data
        function validateFormData(data) {
            if (!data.name || !data.description || !data.price || !data.category) {
                showMessage('Please fill in all required fields.', 'error');
                return false;
            }
            
            if (data.price <= 0) {
                showMessage('Price must be greater than 0.', 'error');
                return false;
            }
            
            if (data.stock < 0) {
                showMessage('Stock cannot be negative.', 'error');
                return false;
            }
            
            return true;
        }

        // Setup image uploads
        function setupImageUploads() {
            // Main image upload
            const mainImageUpload = document.getElementById('mainImageUpload');
            const mainImageInput = document.getElementById('mainImageInput');
            
            mainImageUpload.addEventListener('click', () => mainImageInput.click());
            mainImageUpload.addEventListener('dragover', handleDragOver);
            mainImageUpload.addEventListener('drop', handleMainImageDrop);
            mainImageInput.addEventListener('change', handleMainImageChange);
            
            // Additional images upload
            const additionalImagesUpload = document.getElementById('additionalImagesUpload');
            const additionalImagesInput = document.getElementById('additionalImagesInput');
            
            additionalImagesUpload.addEventListener('click', () => additionalImagesInput.click());
            additionalImagesUpload.addEventListener('dragover', handleDragOver);
            additionalImagesUpload.addEventListener('drop', handleAdditionalImagesDrop);
            additionalImagesInput.addEventListener('change', handleAdditionalImagesChange);
        }

        // Handle drag over
        function handleDragOver(event) {
            event.preventDefault();
            event.currentTarget.classList.add('dragover');
        }

        // Handle main image drop
        function handleMainImageDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('dragover');
            
            const files = event.dataTransfer.files;
            if (files.length > 0) {
                handleMainImageFile(files[0]);
            }
        }

        // Handle main image change
        function handleMainImageChange(event) {
            const file = event.target.files[0];
            if (file) {
                handleMainImageFile(file);
            }
        }

        // Handle main image file
        function handleMainImageFile(file) {
            if (!file.type.startsWith('image/')) {
                showMessage('Please select an image file.', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('mainImagePreview');
                preview.innerHTML = `<img src="${e.target.result}" class="preview-image" style="width: 200px; height: 200px;">`;
                window.mainImageUrl = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Handle additional images drop
        function handleAdditionalImagesDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('dragover');
            
            const files = event.dataTransfer.files;
            handleAdditionalImageFiles(files);
        }

        // Handle additional images change
        function handleAdditionalImagesChange(event) {
            const files = event.target.files;
            handleAdditionalImageFiles(files);
        }

        // Handle additional image files
        function handleAdditionalImageFiles(files) {
            const preview = document.getElementById('additionalImagesPreview');
            window.additionalImageUrls = window.additionalImageUrls || [];
            
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) {
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    window.additionalImageUrls.push(e.target.result);
                    updateAdditionalImagesPreview();
                };
                reader.readAsDataURL(file);
            });
        }

        // Update additional images preview
        function updateAdditionalImagesPreview() {
            const preview = document.getElementById('additionalImagesPreview');
            preview.innerHTML = window.additionalImageUrls.map(url => 
                `<img src="${url}" class="preview-image">`
            ).join('');
        }

        // Setup tag input
        function setupTagInput() {
            const tagInput = document.getElementById('productTags');
            const tagContainer = document.getElementById('tagContainer');
            
            tagInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter' || event.key === ',') {
                    event.preventDefault();
                    addTag(tagInput.value.trim());
                    tagInput.value = '';
                }
            });
        }

        // Add tag
        function addTag(tagText) {
            if (!tagText) return;
            
            const tagContainer = document.getElementById('tagContainer');
            const tag = document.createElement('div');
            tag.className = 'tag';
            tag.innerHTML = `
                ${tagText}
                <span class="tag-remove" onclick="removeTag(this)">&times;</span>
            `;
            tagContainer.appendChild(tag);
        }

        // Remove tag
        function removeTag(element) {
            element.parentElement.remove();
        }

        // Get tags
        function getTags() {
            const tags = [];
            document.querySelectorAll('#tagContainer .tag').forEach(tag => {
                tags.push(tag.textContent.replace('×', '').trim());
            });
            return tags;
        }

        // Get main image
        function getMainImage() {
            return window.mainImageUrl || 'https://via.placeholder.com/400x400?text=Product+Image';
        }

        // Get images
        function getImages() {
            const images = [getMainImage()];
            if (window.additionalImageUrls) {
                images.push(...window.additionalImageUrls);
            }
            return images;
        }

        // Reset form
        function resetForm() {
            document.getElementById('addProductForm').reset();
            document.getElementById('mainImagePreview').innerHTML = '';
            document.getElementById('additionalImagesPreview').innerHTML = '';
            document.getElementById('tagContainer').innerHTML = '';
            window.mainImageUrl = null;
            window.additionalImageUrls = [];
        }

        // Show message
        function showMessage(message, type) {
            const container = document.getElementById('formMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = type === 'success' ? 'success-message' : 'error-message';
            messageDiv.textContent = message;
            
            container.innerHTML = '';
            container.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
