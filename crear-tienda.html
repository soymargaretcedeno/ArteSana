<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/ArteSana_logo.png">
    <title>Crear tienda - ArteSana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .create-store-page {
            min-height: 70vh;
            background: linear-gradient(160deg, #fefae0 0%, #faedcd 45%, #f8e8e0 100%);
            padding: 3rem 0 4rem;
        }
        .create-store-card {
            max-width: 520px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 12px 40px rgba(128, 0, 0, 0.08);
        }
        .create-store-card h1 {
            font-family: 'Playfair Display', serif;
            color: #800000;
            font-size: 1.9rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .create-store-card .lead-text {
            text-align: center;
            color: #6b6657;
            margin-bottom: 1.75rem;
            font-size: 1.05rem;
        }
        .create-store-card .form-label {
            color: #800000;
            font-weight: 600;
        }
        .create-store-card .form-control {
            border-radius: 12px;
            border: 1.5px solid #d4a5a5;
            padding: 0.75rem 1rem;
        }
        .create-store-card .form-control:focus {
            border-color: #800000;
            box-shadow: 0 0 0 3px rgba(128, 0, 0, 0.12);
        }
        .btn-create-store {
            background: #800000;
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            padding: 14px 32px;
            width: 100%;
            font-size: 1.1rem;
        }
        .btn-create-store:hover {
            background: #600000;
            color: #fff;
        }
        .steps-hint {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .steps-hint span {
            background: #fbeee0;
            color: #800000;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <script src="js/local-database.js"></script>
    <script src="js/stores-database.js"></script>
    <script src="js/role-router.js"></script>
    <script src="js/i18n.js"></script>
    <script src="components/header-component.js"></script>
    <script src="components/header-user-component.js"></script>
    <script>window.renderHeader();</script>

    <main class="create-store-page">
        <div class="container">
            <div class="create-store-card">
                <div class="steps-hint">
                    <span data-i18n="create_store_step1">1. Cuenta</span>
                    <span data-i18n="create_store_step2">2. Vendedor</span>
                    <span data-i18n="create_store_step3">3. Tu tienda</span>
                </div>
                <h1 data-i18n="create_store_title">Crea tu tienda</h1>
                <p class="lead-text" data-i18n="create_store_simple_subtitle">Solo unos datos. Después podrás agregar productos desde tu perfil.</p>

                <form id="simpleCreateStoreForm" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label" for="storeName" data-i18n="create_store_name_label">Nombre de la tienda</label>
                        <input type="text" class="form-control" id="storeName" name="name" required maxlength="40" placeholder="Ej: Artesanías Luna">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="storeLocation" data-i18n="create_store_location_label">Ubicación</label>
                        <input type="text" class="form-control" id="storeLocation" name="location" required maxlength="40" placeholder="Ej: Ciudad de Panamá">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="storeDesc" data-i18n="create_store_desc_label">Descripción corta</label>
                        <textarea class="form-control" id="storeDesc" name="desc" rows="2" maxlength="120" placeholder="Qué haces y qué vendes"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="storePhoto" data-i18n="create_store_photo_label">Foto (URL, opcional)</label>
                        <input type="url" class="form-control" id="storePhoto" name="photo" placeholder="https://...">
                    </div>
                    <div id="createStoreError" class="alert alert-danger d-none" role="alert"></div>
                    <button type="submit" class="btn btn-create-store" data-i18n="create_store_btn">Crear tienda</button>
                </form>
            </div>
        </div>
    </main>

    <footer-component></footer-component>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="components/footer-component.js"></script>
    <script src="components/auth-modal.js"></script>
    <auth-modal></auth-modal>
    <script src="js/utils/auth-guard.js"></script>
    <script src="js/theme.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const user = window.localDB && window.localDB.getCurrentUser();
            if (!user) {
                window.location.replace('index.html');
                return;
            }

            // Asegurar rol vendedor
            if (user.role !== 'artisan') {
                window.localDB.becomeSeller(user.id);
            }

            const existing = window.storesDB.getStoreByOwner(user.id);
            if (existing) {
                window.location.replace('perfil.html');
                return;
            }

            document.getElementById('simpleCreateStoreForm').addEventListener('submit', function (e) {
                e.preventDefault();
                const err = document.getElementById('createStoreError');
                err.classList.add('d-none');

                const result = window.storesDB.createStore(user.id, {
                    name: document.getElementById('storeName').value,
                    location: document.getElementById('storeLocation').value,
                    desc: document.getElementById('storeDesc').value,
                    photo: document.getElementById('storePhoto').value
                });

                if (!result.success) {
                    err.textContent = result.message === 'missing_fields'
                        ? 'Completa el nombre y la ubicación.'
                        : 'No se pudo crear la tienda. Intenta de nuevo.';
                    err.classList.remove('d-none');
                    return;
                }

                window.location.href = 'perfil.html#my-products';
            });
        });
    </script>
</body>
</html>
