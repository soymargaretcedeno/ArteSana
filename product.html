<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - ArteSana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-gallery {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(162,42,34,0.15);
        }
        
        .main-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .main-image:hover {
            transform: scale(1.05);
        }
        
        .thumbnail-gallery {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .thumbnail.active {
            border-color: #a22a22;
            transform: scale(1.1);
        }
        
        .product-info {
            padding: 2rem;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(162,42,34,0.1);
        }
        
        .product-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #a22a22;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .product-price {
            font-size: 2rem;
            color: #a22a22;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .original-price {
            text-decoration: line-through;
            color: #999;
            font-size: 1.2rem;
            margin-left: 10px;
        }
        
        .product-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        
        .stars {
            color: #ffc107;
        }
        
        .product-description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #666;
            margin-bottom: 2rem;
        }
        
        .product-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .meta-item {
            background: #f8f6ee;
            padding: 1rem;
            border-radius: 12px;
            border-left: 4px solid #a22a22;
        }
        
        .meta-label {
            font-weight: 600;
            color: #a22a22;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        
        .meta-value {
            color: #333;
            font-size: 1rem;
        }
        
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 2rem;
        }
        
        .quantity-controls {
            display: flex;
            align-items: center;
            border: 2px solid #a22a22;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .qty-btn {
            background: #a22a22;
            color: white;
            border: none;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .qty-btn:hover {
            background: #800000;
        }
        
        .qty-input {
            border: none;
            text-align: center;
            padding: 12px;
            width: 60px;
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 2rem;
        }
        
        .btn-primary {
            background: #800000;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #600000;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(128,0,0,0.3);
        }
        
        .btn-outline {
            border: 2px solid #800000;
            color: #800000;
            background: transparent;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        .btn-outline:hover {
            background: #800000;
            color: white;
        }
        
        .artisan-info {
            background: #f8f6ee;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }
        
        .artisan-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 1rem;
        }
        
        .artisan-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #a22a22;
        }
        
        .artisan-details h4 {
            margin: 0;
            color: #a22a22;
            font-weight: 700;
        }
        
        .artisan-location {
            color: #666;
            font-size: 0.9rem;
        }
        
        .artisan-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffc107;
        }
        
        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 2rem;
        }
        
        .tag {
            background: #fcf7de;
            color: #a22a22;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .stock-info {
            background: #e8f5e8;
            color: #2d5a2d;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border-left: 4px solid #4caf50;
        }
        
        .stock-warning {
            background: #fff3cd;
            color: #856404;
            border-left-color: #ffc107;
        }
        
        .stock-danger {
            background: #f8d7da;
            color: #721c24;
            border-left-color: #dc3545;
        }
        
        .shipping-info {
            background: #e3f2fd;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            border-left: 4px solid #2196f3;
        }
        
        .shipping-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
            color: #1976d2;
            font-weight: 600;
        }
        
        .related-products {
            margin-top: 4rem;
        }
        
        .related-product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(162,42,34,0.1);
            transition: transform 0.3s ease;
        }
        
        .related-product-card:hover {
            transform: translateY(-5px);
        }
        
        .related-product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .related-product-info {
            padding: 1rem;
        }
        
        .related-product-title {
            font-weight: 600;
            color: #a22a22;
            margin-bottom: 0.5rem;
        }
        
        .related-product-price {
            color: #666;
            font-weight: 600;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast.error {
            background: #f44336;
        }
        
        @media (max-width: 768px) {
            .product-title {
                font-size: 2rem;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .product-meta {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <script src="js/local-database.js"></script>
    <script src="js/products-database.js"></script>
    <script src="js/user-products-database.js"></script>
    <script src="js/ecommerce-confirmation.js"></script>
    <script src="js/i18n.js"></script>
    <script src="components/header-component.js"></script>
    <script src="components/header-user-component.js"></script>
    <script>window.renderHeader();</script>

    <main class="py-5" style="background: var(--light-bg, #FEFAE0); min-height: 80vh;">
        <div class="container">
            <div id="productContainer">
                <!-- Product content will be loaded here -->
            </div>
        </div>
    </main>

    <footer-component></footer-component>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="components/footer-component.js"></script>
    <script src="components/auth-modal.js"></script>
    <auth-modal></auth-modal>
    
    <script>
        // Initialize AOS
        AOS.init({
            duration: 800,
            once: true
        });

        // Get product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        // Load product details
        function loadProductDetails() {
            if (!productId) {
                showToast('Product not found', 'error');
                return;
            }

            const product = window.userProductsDB.getProductById(productId);
            if (!product) {
                showToast('Product not found', 'error');
                return;
            }

            renderProduct(product);
            loadRelatedProducts(product);
        }

        // Render product details
        function renderProduct(product) {
            const container = document.getElementById('productContainer');
            
            const stockClass = product.stock > 5 ? '' : product.stock > 0 ? 'stock-warning' : 'stock-danger';
            const stockText = product.stock > 5 ? `In stock (${product.stock} available)` : 
                             product.stock > 0 ? `Low stock (${product.stock} left)` : 'Out of stock';

            container.innerHTML = `
                <div class="row">
                    <!-- Product Gallery -->
                    <div class="col-lg-6" data-aos="fade-right">
                        <div class="product-gallery">
                            <img src="${product.mainImage}" alt="${product.name}" class="main-image" id="mainImage">
                            <div class="thumbnail-gallery">
                                ${product.images.map((image, index) => `
                                    <img src="${image}" alt="${product.name}" class="thumbnail ${index === 0 ? 'active' : ''}" 
                                         onclick="changeMainImage('${image}', this)">
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Product Info -->
                    <div class="col-lg-6" data-aos="fade-left">
                        <div class="product-info">
                            <h1 class="product-title">${product.name}</h1>
                            
                            <div class="product-price">
                                $${product.price.toFixed(2)}
                                ${product.originalPrice > product.price ? `<span class="original-price">$${product.originalPrice.toFixed(2)}</span>` : ''}
                            </div>

                            <div class="product-rating">
                                <div class="stars">
                                    ${'★'.repeat(Math.floor(product.rating))}${'☆'.repeat(5 - Math.floor(product.rating))}
                                </div>
                                <span>${product.rating} (${product.reviews} reviews)</span>
                            </div>

                            <div class="product-tags">
                                ${product.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>

                            <p class="product-description">${product.description}</p>

                            <div class="stock-info ${stockClass}">
                                <i class="fas fa-box"></i> ${stockText}
                            </div>

                            <div class="product-meta">
                                <div class="meta-item">
                                    <div class="meta-label">Dimensions</div>
                                    <div class="meta-value">${product.dimensions}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Weight</div>
                                    <div class="meta-value">${product.weight}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Materials</div>
                                    <div class="meta-value">${product.materials.join(', ')}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Category</div>
                                    <div class="meta-value">${product.category.charAt(0).toUpperCase() + product.category.slice(1)}</div>
                                </div>
                            </div>

                            <div class="quantity-selector">
                                <label for="quantity" style="font-weight: 600; color: #a22a22;">Quantity:</label>
                                <div class="quantity-controls">
                                    <button class="qty-btn" onclick="changeQuantity(-1)">-</button>
                                    <input type="number" id="quantity" class="qty-input" value="1" min="1" max="${product.stock}">
                                    <button class="qty-btn" onclick="changeQuantity(1)">+</button>
                                </div>
                            </div>

                            <div class="action-buttons">
                                <button class="btn btn-primary" onclick="addToCart(${product.id})" ${product.stock === 0 ? 'disabled' : ''}>
                                    <i class="fas fa-shopping-cart"></i> Add to Cart
                                </button>
                                <button class="btn btn-outline" onclick="toggleFavorite(${product.id})">
                                    <i class="fas fa-heart" id="favoriteIcon"></i> 
                                    <span id="favoriteText">Add to Favorites</span>
                                </button>
                                <button class="btn btn-outline" onclick="toggleComparison(${product.id})">
                                    <i class="fas fa-balance-scale" id="compareIcon"></i> 
                                    <span id="compareText">Add to Comparison</span>
                                </button>
                            </div>

                            <div class="artisan-info">
                                <div class="artisan-header">
                                    <img src="${product.artisan.avatar}" alt="${product.artisan.name}" class="artisan-avatar">
                                    <div class="artisan-details">
                                        <h4>${product.artisan.name}</h4>
                                        <div class="artisan-location">${product.artisan.location}</div>
                                        <div class="artisan-rating">
                                            ${'★'.repeat(Math.floor(product.artisan.rating))}${'☆'.repeat(5 - Math.floor(product.artisan.rating))}
                                            <span style="color: #666; margin-left: 5px;">${product.artisan.rating}</span>
                                        </div>
                                    </div>
                                </div>
                                <p style="margin: 0; color: #666;">Crafted with love and tradition by ${product.artisan.name} from ${product.artisan.location}.</p>
                            </div>

                            <div class="shipping-info">
                                <div class="shipping-header">
                                    <i class="fas fa-shipping-fast"></i>
                                    Shipping Information
                                </div>
                                <p style="margin: 0; color: #666;">
                                    <strong>Estimated delivery:</strong> ${product.shipping.estimatedDays}<br>
                                    <strong>Package weight:</strong> ${product.shipping.weight}kg<br>
                                    <strong>Dimensions:</strong> ${product.shipping.dimensions}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Related Products -->
                <div class="related-products">
                    <h3 class="mb-4" style="font-family: 'Playfair Display', serif; color: #a22a22;">Related Products</h3>
                    <div class="row g-4" id="relatedProducts">
                        <!-- Related products will be loaded here -->
                    </div>
                </div>
            `;

            // Update button states
            updateFavoriteButton(product.id);
            updateComparisonButton(product.id);
        }

        // Change main image
        function changeMainImage(imageSrc, thumbnail) {
            document.getElementById('mainImage').src = imageSrc;
            document.querySelectorAll('.thumbnail').forEach(thumb => thumb.classList.remove('active'));
            thumbnail.classList.add('active');
        }

        // Change quantity
        function changeQuantity(delta) {
            const input = document.getElementById('quantity');
            const newValue = parseInt(input.value) + delta;
            const max = parseInt(input.max);
            
            if (newValue >= 1 && newValue <= max) {
                input.value = newValue;
            }
        }

        // Add to cart
        function addToCart(productId) {
            const quantity = parseInt(document.getElementById('quantity').value);
            const success = window.productsDB.addToCart(productId, quantity);
            
            if (success) {
                window.ecommerceConfirmation.showCartConfirmation(productId, quantity);
            } else {
                window.ecommerceConfirmation.showEnhancedToast('Failed to add product to cart', 'error');
            }
        }

        // Toggle favorite
        function toggleFavorite(productId) {
            const isInFavorites = window.userProductsDB.isInFavorites(productId);
            
            if (isInFavorites) {
                window.userProductsDB.removeFromFavorites(productId);
                window.ecommerceConfirmation.showFavoriteConfirmation(productId, false);
            } else {
                window.userProductsDB.addToFavorites(productId);
                window.ecommerceConfirmation.showFavoriteConfirmation(productId, true);
            }
            
            updateFavoriteButton(productId);
        }

        // Toggle comparison
        function toggleComparison(productId) {
            const isInComparison = window.userProductsDB.isInComparison(productId);
            
            if (isInComparison) {
                window.userProductsDB.removeFromComparison(productId);
                window.ecommerceConfirmation.showComparisonConfirmation(productId, false);
            } else {
                window.userProductsDB.addToComparison(productId);
                window.ecommerceConfirmation.showComparisonConfirmation(productId, true);
            }
            
            updateComparisonButton(productId);
        }

        // Update favorite button
+-        function updateFavoriteButton(productId) {
            const isInFavorites = window.userProductsDB.isInFavorites(productId);
            const icon = document.getElementById('favoriteIcon');
            const text = document.getElementById('favoriteText');
            
            if (isInFavorites) {
                icon.style.color = '#e74c3c';
                text.textContent = 'Remove from Favorites';
            } else {
                icon.style.color = '#666';
                text.textContent = 'Add to Favorites';
            }
        }

        // Update comparison button
        function updateComparisonButton(productId) {
            const isInComparison = window.userProductsDB.isInComparison(productId);
            const icon = document.getElementById('compareIcon');
            const text = document.getElementById('compareText');
            
            if (isInComparison) {
                icon.style.color = '#a22a22';
                text.textContent = 'Remove from Comparison';
            } else {
                icon.style.color = '#666';
                text.textContent = 'Add to Comparison';
            }
        }

        // Load related products
        function loadRelatedProducts(currentProduct) {
            const relatedProducts = window.userProductsDB.getProductsByCategory(currentProduct.category)
                .filter(product => product.id !== currentProduct.id)
                .slice(0, 4);

            const container = document.getElementById('relatedProducts');
            
            if (relatedProducts.length === 0) {
                container.innerHTML = '<div class="col-12 text-center"><p>No related products found.</p></div>';
                return;
            }

            container.innerHTML = relatedProducts.map(product => `
                <div class="col-md-6 col-lg-3">
                    <div class="related-product-card" onclick="window.location.href='product.html?id=${product.id}'">
                        <img src="${product.mainImage}" alt="${product.name}" class="related-product-image">
                        <div class="related-product-info">
                            <div class="related-product-title">${product.name}</div>
                            <div class="related-product-price">$${product.price.toFixed(2)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('show');
            }, 100);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Load product when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadProductDetails();
        });
    </script>
</body>
</html>
