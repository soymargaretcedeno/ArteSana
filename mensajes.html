<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#8B5E3C">
    <link rel="icon" type="image/png" href="assets/ArteSana_logo.png">
    <title>Mensajes - ArteSana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <link href="css/arti.css" rel="stylesheet">
    <link href="components/messages/messages.css" rel="stylesheet">
</head>
<body class="messages-page" data-app-core="manual" data-enhanced-messages="true">
    <script src="js/local-database.js"></script>
    <script src="components/roles/role-service.js"></script>
    <script src="js/i18n.js"></script>
    <script src="components/header-component.js"></script>
    <script src="components/header-user-component.js"></script>
    <script>window.renderHeader();</script>

    <main class="messages-page-main" aria-label="Mensajes con artesanos y clientes">
        <messages-overlay></messages-overlay>
    </main>

    <script src="js/services/platform-services.js"></script>
    <script src="components/messages/messages-init.js"></script>
    <script src="js/app-core.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.AppCore) {
                await window.AppCore.init({ widgets: false, auth: true });
            }
            if (window.MessagesInit) {
                await window.MessagesInit.init();
            }
            const overlay = document.querySelector('messages-overlay');
            if (overlay && typeof overlay.open === 'function') {
                overlay.open();
            }
            if (window.ArtiGuide) window.ArtiGuide.init();
            else {
                await window.AppCore.loadScript('js/arti-chat.js');
                window.ArtiGuide?.init();
            }
        });
    </script>
    <script src="js/theme.js"></script>
    <script src="components/auth-modal.js"></script>
    <auth-modal></auth-modal>
</body>
</html>
