<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/ArteSana_logo.png">
    <title>Store - ArteSana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/store.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="store-page">
    <script src="js/local-database.js"></script>
    <script src="js/products-database.js"></script>
    <script src="js/user-products-database.js"></script>
    <script src="js/i18n.js"></script>
    <script src="components/header-component.js"></script>
    <script src="components/header-user-component.js"></script>
    <script src="components/roles/role-service.js"></script>
    <script>window.renderHeader();</script>

    <main class="store-main">
        <!-- Hero igual que Home / Explore -->
        <div class="store-hero-wrapper">
            <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000" aria-label="Tiendas artesanales">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <div class="hero-section" style="background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://mir-s3-cdn-cf.behance.net/project_modules/1400/94fafc153875059.63375a2c3d38a.jpg');"></div>
                    </div>
                    <div class="carousel-item">
                        <div class="hero-section" style="background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://thumbs.dreamstime.com/b/artes-de-panam%C3%A1-18961136.jpg');"></div>
                    </div>
                    <div class="carousel-item">
                        <div class="hero-section" style="background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://www.panamaamerica.com.pa/sites/default/files/imagenes/2015/08/03/feria_artesanias-_13.jpg');"></div>
                    </div>
                    <div class="carousel-item">
                        <div class="hero-section" style="background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://image-tc.galaxy.tf/wijpeg-9x9rcf5hvoizt0edeilnon79r/mercado-de-artesanias-5-de-mayo-2_standard.jpg?crop=106%2C0%2C1689%2C1267');"></div>
                    </div>
                    <div class="carousel-item">
                        <div class="hero-section" style="background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://mupa.gob.pa/wp-content/uploads/2024/07/mercado-balboa5.jpg');"></div>
                    </div>
                </div>
            </div>

            <div class="hero-content-overlay">
                <div class="container">
                    <div class="hero-content">
                        <h1 class="hero-title" data-aos="fade-up" data-i18n="store_hero_title">Descubre tiendas artesanales</h1>
                        <p class="hero-subtitle" data-aos="fade-up" data-aos-delay="200" data-i18n="store_hero_subtitle">Explora tiendas únicas de artesanos panameños</p>
                        <div id="storeCreateBtnWrap" class="d-flex justify-content-center gap-3" data-aos="fade-up" data-aos-delay="400">
                            <button type="button" class="btn btn-primary" id="storeCreateBtn" data-i18n="store_create_btn">Crear mi tienda</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section class="stores-list-section">
            <div class="container">
                <div class="row g-4" id="storesGrid"></div>
            </div>
        </section>
    </main>
    <footer-component></footer-component>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="components/footer-component.js"></script>
    <!-- Modal para crear tienda -->
    <div class="modal fade" id="createStoreModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="border-radius:22px;overflow:hidden;">
          <div class="modal-body" style="background:#fff;padding:2.5rem 2rem 2rem 2rem;position:relative;">
            <button type="button" class="btn" data-bs-dismiss="modal" aria-label="Close" style="position:absolute;top:22px;right:22px;background:#fbeee0;border-radius:50%;padding:10px;box-shadow:0 2px 8px rgba(128,0,0,0.10);opacity:1;display:flex;align-items:center;justify-content:center;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15.5 19L9.5 12L15.5 5" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <h2 data-i18n="create_store_title" style="color:#8F1111;font-family:'Playfair Display',serif;font-weight:700;text-align:center;margin-bottom:1.2rem;">Create your Store</h2>
            <form id="createStoreForm" autocomplete="off">
              <div class="mb-3">
                <label class="form-label" data-i18n="create_store_name_label" style="color:#8F1111;font-weight:600;">Store Name</label>
                <input type="text" class="form-control" name="name" required maxlength="32" style="border-radius:12px;border:1.5px solid #8F1111;">
              </div>
              <div class="mb-3">
                <label class="form-label" data-i18n="create_store_location_label" style="color:#8F1111;font-weight:600;">Location</label>
                <input type="text" class="form-control" name="location" required maxlength="32" style="border-radius:12px;border:1.5px solid #8F1111;">
              </div>
              <div class="mb-3">
                <label class="form-label" data-i18n="create_store_photo_label" style="color:#8F1111;font-weight:600;">Photo (URL)</label>
                <input type="url" class="form-control" name="photo" placeholder="https://..." style="border-radius:12px;border:1.5px solid #8F1111;">
              </div>
              <div class="mb-3">
                <label class="form-label" data-i18n="create_store_desc_label" style="color:#8F1111;font-weight:600;">Short Description</label>
                <textarea class="form-control" name="desc" rows="2" maxlength="80" style="border-radius:12px;border:1.5px solid #8F1111;"></textarea>
              </div>
              <div class="d-flex justify-content-center mt-4">
                <button type="submit" class="btn" data-i18n="create_store_btn" style="background:#8F1111;color:#fff;font-weight:700;font-size:1.2rem;padding:12px 38px;border-radius:30px;box-shadow:0 2px 12px rgba(128,0,0,0.10);">Create Store</button>
              </div>
            </form>
            <div id="createStoreSuccess" class="alert alert-success mt-4 d-none" data-i18n="create_store_success" style="text-align:center;">Store created successfully!</div>
          </div>
        </div>
      </div>
    </div>
    <script src="components/store/public-store-service.js"></script>
    <script src="components/store/store-list-page.js"></script>
    <script>
    window.openCreateStoreFlow = function() {
        const user = window.RoleService?.getCurrentUser();
        if (user) {
            window.location.href = 'perfil.html#create-store';
            return;
        }
        document.querySelector('auth-modal')?.open('register');
    };

    document.getElementById('storeCreateBtn')?.addEventListener('click', () => window.openCreateStoreFlow());

    (function initStoreHero() {
        const createBtnWrap = document.getElementById('storeCreateBtnWrap');
        const user = window.RoleService?.getCurrentUser();
        if (createBtnWrap && user && window.RoleService.isArtisan(user)) {
            createBtnWrap.style.display = 'none';
        }
    })();
    // Lógica para guardar la tienda
    document.getElementById('createStoreForm').onsubmit = function(e) {
      e.preventDefault();
      const form = e.target;
      const name = form.name.value.trim();
      const location = form.location.value.trim();
      const photo = form.photo.value.trim();
      const desc = form.desc.value.trim();
      if (!name || !location) return;
      const store = { name, location, photo, desc };
      localStorage.setItem('myStore', JSON.stringify(store));
      document.getElementById('createStoreSuccess').classList.remove('d-none');
      setTimeout(() => {
        bootstrap.Modal.getInstance(document.getElementById('createStoreModal')).hide();
        window.location.reload();
      }, 1200);
    };
    </script>
    <script src="js/theme.js"></script>
    <script src="components/auth-modal.js"></script>
    <auth-modal></auth-modal>
</body>
</html>
