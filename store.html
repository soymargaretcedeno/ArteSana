    <section class="stores-hero" style="background: linear-gradient(120deg, rgba(162,42,34,0.45) 0%, rgba(252,247,222,0.45) 100%), url('https://mir-s3-cdn-cf.behance.net/project_modules/1400/94fafc153875059.63375a2c3d38a.jpg'); background-size:cover; background-position:center; min-height:420px; padding: 80px 0 60px 0; text-align:center;">

            ]
        },
        {
            avatar: 'https://images.unsplash.com/photo-1527980965255-d3b416303d12?w=400&h=400&fit=crop&crop=faces',

            desc: 'Art and accessories with Afro-Antillean influence.',
            cta: 'Discover Colón',

            products: [
                {img: 'https://tse2.mm.bing.net/th/id/OIP.qDOr85auzCeqS355yW2K_wHaE8?r=0&rs=1&pid=ImgDetMain&o=7&rm=3', name: 'Máscara Congo'},

            ]

        {
            avatar: '',
            name: 'Los Santos Tradition',
            desc: 'Polleras, hats, and embroidery from Los Santos.',
            cta: 'See Tradition',
            featured: false,
            products: [
                {img: 'https://tse1.mm.bing.net/th/id/OIP.kTMA9Neki4nog9NVIN0TigHaFj?r=0&rs=1&pid=ImgDetMain&o=7&rm=3', name: 'Pollera santeña'},

                {img: 'https://i.pinimg.com/736x/bd/d6/0d/bdd60d9156b2e50cc18e2f0209c8228d--panama-canal-folklore.jpg', name: 'Tembleques'}
            ]
        }
    ];
    const storesGrid = document.getElementById('storesGrid');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const userStores = (window.storesDB && window.storesDB.getAllStores()) || [];
    userStores.forEach((store) => {
        const card = document.createElement('div');
        card.className = 'col-md-6 col-lg-4';
        const initials = store.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
        card.innerHTML = `
            <div class="store-card shadow-sm" style="background: linear-gradient(120deg, #fff 80%, #fbeee0 100%); border-radius: 18px; padding: 1.5rem; min-height: 200px; cursor:pointer;" onclick="window.location.href='tienda.html?id=${encodeURIComponent(store.id)}'">
                <div class="artisan-header" style="display:flex;align-items:center;gap:14px;margin-bottom:12px;">
                  ${store.photo
                    ? `<img src="${esc(store.photo)}" alt="${esc(store.name)}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #a22a22;">`
                    : `<div style="width:56px;height:56px;border-radius:50%;border:3px dashed #a22a22;display:flex;align-items:center;justify-content:center;background:#fff;color:#a22a22;font-weight:800;">${esc(initials)}</div>`}
                  <div style="flex:1;">
                    <h3 style="font-size:1.25rem;color:#a22a22;font-weight:700;margin:0 0 4px 0;">${esc(store.name)}</h3>
                    <p style="color:#6b6657;font-size:1rem;margin:0;">${esc(store.location)}</p>
                    ${store.desc ? `<p style="color:#575443;font-size:0.95rem;margin:6px 0 0 0;">${esc(store.desc)}</p>` : ''}
                  </div>
                </div>
                <span class="badge" style="background:#800000;color:#fff;">Nueva</span>
            </div>
        `;
        storesGrid.appendChild(card);
    });

    stores.forEach((store, idx) => {
        const card = document.createElement('div');
        card.className = 'col-md-6 col-lg-4';
        card.innerHTML = `
            <div class="store-card shadow-sm" style="background: linear-gradient(120deg, #fff 80%, #fbeee0 100%); border-radius: 18px; padding: 1.5rem; min-height: 260px; cursor:pointer;" onclick="window.location.href='tienda.html?demo=${idx}'">
                <div class="artisan-header" style="display:flex;align-items:center;gap:14px;margin-bottom:12px;">
                  ${store.avatar ? `<img src="${store.avatar}" alt="${store.name}" class="artisan-avatar" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #a22a22;">` : `<div class='avatar-fallback' style="width:56px;height:56px;border-radius:50%;border:3px dashed #a22a22;display:flex;align-items:center;justify-content:center;background:#fff;color:#a22a22;font-weight:800;">${store.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>`}
                  <div class="artisan-details" style="flex:1;">
                    <h3 class="store-name" style="font-size:1.25rem;color:#a22a22;font-weight:700;margin:0 0 4px 0;">${store.name}</h3>
                    <p class="store-desc" style="color:#6b6657;font-size:1rem;margin:0;">${store.desc}</p>
                  </div>
                </div>
                <div class="popular-products" style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-top:8px;">
                  ${store.products.slice(0,3).map(p => `
                    <div class='product-mini' style="background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(80,0,0,0.08);overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;">
                      <img src='${p.img}' alt='${p.name}' style="width:100%;height:90px;object-fit:cover;">
                      <span style="padding:6px 8px;font-size:0.9rem;color:#575443;">${p.name}</span>
                    </div>
                  `).join('')}
                </div>
            </div>
        `;
        storesGrid.appendChild(card);
    });
