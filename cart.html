<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/ArteSana_logo.png">
    <title>Shopping Cart - ArteSana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <script src="js/local-database.js"></script>
    <script src="js/products-database.js"></script>
    <script src="js/user-products-database.js"></script>
    <script src="components/store/public-store-service.js"></script>
    <script src="js/i18n.js"></script>
    <script src="components/header-component.js"></script>
    <script src="components/header-user-component.js"></script>
    <script src="js/theme.js"></script>
    <script>window.renderHeader();</script>

    <!-- Cart Section -->
    <section class="cart-section py-5">
        <div class="container">
            <h1 class="mb-4 cart-page-title" data-i18n="cart_title">Shopping Cart</h1>

            <div id="emptyCartMessage" class="cart-empty-state" style="display: none;">
                <i class="fas fa-shopping-cart" aria-hidden="true"></i>
                <h3 data-i18n="cart_empty">Tu carrito está vacío</h3>
                <p data-i18n="cart_empty_hint">Agrega artesanías para comenzar.</p>
                <a href="explorar.html" class="btn btn-primary" data-i18n="cart_continue_shopping">Continue Shopping</a>
            </div>
            
            <!-- Cart Content -->
            <div class="row" id="cartContentRow">
                <!-- Cart Items -->
                <div class="col-lg-8">
                    <div id="cartItemsContainer"></div>

                    <!-- Cart Actions -->
                    <div class="cart-actions mt-4" id="cartActions" style="display: none;">
                        <a href="explorar.html" class="btn btn-outline-primary" data-i18n="cart_continue_shopping">Continue Shopping</a>
                        <button class="btn btn-outline-danger" onclick="clearCart()" data-i18n="cart_clear_cart">Clear Cart</button>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="col-lg-4">
                    <div class="order-summary" data-aos="fade-left" id="orderSummary" style="display: none;">
                        <h3 data-i18n="cart_order_summary">Order Summary</h3>
                        <div class="summary-item">
                            <span data-i18n="cart_subtotal">Subtotal</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        <div class="summary-item">
                            <span data-i18n="cart_discount">Discount</span>
                            <span id="discount">-$0.00</span>
                        </div>
                        <div class="summary-item">
                            <span data-i18n="cart_shipping">Shipping</span>
                            <span id="shipping">$0.00</span>
                        </div>
                        <div class="summary-item">
                            <span data-i18n="cart_tax">Tax</span>
                            <span id="tax">$0.00</span>
                        </div>
                        <div class="summary-total">
                            <span data-i18n="cart_total">Total</span>
                            <span id="total">$0.00</span>
                        </div>
                        <button class="btn btn-primary w-100" onclick="proceedToCheckout()" data-i18n="cart_checkout">Proceed to Checkout</button>
                    </div>

                    <!-- Promo Code -->
                    <div class="promo-code mt-4" data-aos="fade-left" data-aos-delay="100" id="promoCodeSection" style="display: none;">
                        <h4 data-i18n="cart_promo_code">Promo Code</h4>
                        <div class="input-group">
                            <input type="text" class="form-control" id="promoCodeInput" placeholder="Enter code" data-i18n="cart_promo_placeholder">
                            <button class="btn btn-outline-primary" onclick="applyPromoCode()" data-i18n="cart_apply">Apply</button>
                        </div>
                        <div id="promoMessage" class="mt-2" style="display: none;"></div>
                    </div>

                    <!-- Secure Checkout -->
                    <div class="secure-checkout mt-4" data-aos="fade-left" data-aos-delay="200" id="secureCheckoutSection" style="display: none;">
                        <h4 data-i18n="cart_secure_checkout">Secure Checkout</h4>
                        <div class="payment-methods">
                            <i class="fab fa-cc-visa"></i>
                            <i class="fab fa-cc-mastercard"></i>
                            <i class="fab fa-cc-amex"></i>
                            <i class="fab fa-cc-paypal"></i>
                        </div>
                        <p class="security-note">
                            <i class="fas fa-lock"></i>
                            <span data-i18n="cart_secure_note">Your payment information is secure</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Component -->
    <script src="components/footer-component.js"></script>
    <footer-component></footer-component>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true
        });

        // Cart functionality
        let appliedDiscount = 0;
        let appliedPromoCode = '';

        function tr(key, fallback) {
            return typeof window.t === 'function' ? window.t(key, fallback) : fallback;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadCart();
            const container = document.getElementById('cartItemsContainer');
            if (!container || container.dataset.bound === 'true') return;
            container.dataset.bound = 'true';
            container.addEventListener('click', function(event) {
                const removeBtn = event.target.closest('[data-remove-id]');
                if (removeBtn) {
                    event.preventDefault();
                    removeFromCart(removeBtn.getAttribute('data-remove-id'));
                    return;
                }
                const qtyBtn = event.target.closest('[data-qty-delta]');
                if (qtyBtn) {
                    event.preventDefault();
                    updateQuantity(qtyBtn.getAttribute('data-product-id'), Number(qtyBtn.getAttribute('data-qty-delta')));
                }
            });
            container.addEventListener('change', function(event) {
                const input = event.target.closest('[data-qty-input]');
                if (!input) return;
                updateQuantity(input.getAttribute('data-product-id'), 0, input.value);
            });
        });

        function loadCart() {
            const cartItems = window.productsDB.getCartItems();
            const container = document.getElementById('cartItemsContainer');
            const emptyMessage = document.getElementById('emptyCartMessage');
            const cartActions = document.getElementById('cartActions');
            const orderSummary = document.getElementById('orderSummary');
            const promoSection = document.getElementById('promoCodeSection');
            const secureSection = document.getElementById('secureCheckoutSection');

            const cartContentRow = document.getElementById('cartContentRow');

            const cartSection = document.querySelector('.cart-section');
            if (cartSection) cartSection.classList.toggle('is-empty', !cartItems.length);

            if (!cartItems.length) {
                container.style.display = 'none';
                emptyMessage.style.display = 'flex';
                if (cartContentRow) cartContentRow.style.display = 'none';
                cartActions.style.display = 'none';
                orderSummary.style.display = 'none';
                promoSection.style.display = 'none';
                secureSection.style.display = 'none';
                return;
            }

            if (cartContentRow) cartContentRow.style.display = '';
            container.style.display = 'block';
            emptyMessage.style.display = 'none';
            cartActions.style.display = 'block';
            orderSummary.style.display = 'block';
            promoSection.style.display = 'block';
            secureSection.style.display = 'block';

            container.innerHTML = cartItems.map((item) => {
                const product = item.product || {};
                const productId = String(item.productId);
                const name = escapeHtml(product.name || 'Producto');
                const artisanName = escapeHtml(product.artisan?.name || product.artisan || product.store || '');
                const image = escapeHtml(product.mainImage || product.images?.[0] || 'assets/ArteSana_logo.png');
                const price = Number(product.price) || 0;
                const stock = Number(product.stock) || 99;
                return `
                <div class="cart-item" data-product-id="${escapeHtml(productId)}">
                    <div class="item-image">
                        <img src="${image}" alt="${name}">
                    </div>
                    <div class="item-details">
                        <h3>${name}</h3>
                        <p class="artisan">${artisanName ? `${tr('cart_by', 'Por')} ${artisanName}` : ''}</p>
                        <div class="item-meta">
                            <span class="price">$${price.toFixed(2)}</span>
                            <div class="quantity-control">
                                <button type="button" class="qty-btn" data-product-id="${escapeHtml(productId)}" data-qty-delta="-1">-</button>
                                <input type="number" value="${item.quantity}" min="1" max="${stock}" data-qty-input data-product-id="${escapeHtml(productId)}">
                                <button type="button" class="qty-btn" data-product-id="${escapeHtml(productId)}" data-qty-delta="1">+</button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="remove-item" data-remove-id="${escapeHtml(productId)}" aria-label="${tr('cart_remove_item', 'Eliminar')}">
                        <i class="fas fa-times"></i>
                        <span>${tr('cart_remove_item', 'Eliminar')}</span>
                    </button>
                </div>`;
            }).join('');

            updateOrderSummary();
        }

        function updateQuantity(productId, delta, newValue = null) {
            let quantity;
            if (newValue !== null) {
                quantity = parseInt(newValue, 10);
            } else {
                const currentQuantity = window.productsDB.cart.find((item) => String(item.productId) === String(productId))?.quantity || 0;
                quantity = currentQuantity + delta;
            }

            window.productsDB.updateCartQuantity(productId, quantity);
            loadCart();
        }

        function removeFromCart(productId) {
            window.productsDB.removeFromCart(productId);
            loadCart();
        }

        function clearCart() {
            if (confirm(tr('cart_clear_confirm', '¿Vaciar todo el carrito?'))) {
                window.productsDB.clearCart();
                loadCart();
            }
        }

        // Update order summary
        function updateOrderSummary() {
            const cartItems = window.productsDB.getCartItems();
            const subtotal = window.productsDB.getCartTotal();
            const shipping = window.productsDB.calculateShipping(cartItems);
            const tax = subtotal * 0.07; // 7% tax
            const total = subtotal + shipping + tax - appliedDiscount;

            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('discount').textContent = `-$${appliedDiscount.toFixed(2)}`;
            document.getElementById('shipping').textContent = `$${shipping.toFixed(2)}`;
            document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('total').textContent = `$${total.toFixed(2)}`;
        }

        // Apply promo code
        function applyPromoCode() {
            const code = document.getElementById('promoCodeInput').value.trim();
            const messageDiv = document.getElementById('promoMessage');
            
            if (!code) {
                showPromoMessage('Please enter a promo code', 'error');
                return;
            }

            const cartItems = window.productsDB.getCartItems();
            const subtotal = window.productsDB.getCartTotal();
            const discount = window.productsDB.applyDiscount(code, subtotal);

            if (discount > 0) {
                appliedDiscount = discount;
                appliedPromoCode = code;
                showPromoMessage(`Promo code applied! You saved $${discount.toFixed(2)}`, 'success');
                document.getElementById('promoCodeInput').value = '';
                updateOrderSummary();
            } else {
                showPromoMessage('Invalid promo code', 'error');
            }
        }

        // Show promo message
        function showPromoMessage(message, type) {
            const messageDiv = document.getElementById('promoMessage');
            messageDiv.textContent = message;
            messageDiv.className = `mt-2 alert alert-${type === 'success' ? 'success' : 'danger'}`;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // Proceed to checkout
        function proceedToCheckout() {
            window.location.href = 'checkout.html';
        }
    </script>
    <script src="components/auth-modal.js"></script>
    <auth-modal></auth-modal>
</body>
</html>
