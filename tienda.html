<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/ArteSana_logo.png">
    <title>Tienda | ArteSana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/store.css">
    <style>
      .store-hero-block {
        background: linear-gradient(120deg, rgba(128,0,0,0.92), rgba(162,42,34,0.85));
        color: #fff;
        border-radius: 20px;
        padding: 2rem;
      }
      .store-hero-block img {
        width: 96px; height: 96px; border-radius: 50%;
        object-fit: cover; border: 3px solid #fbeee0;
      }
      .product-card-tienda {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 2px 16px rgba(80,0,0,0.07);
        padding: 1.2rem;
        text-align: center;
        height: 100%;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .product-card-tienda:hover { transform: translateY(-6px); }
      .product-card-tienda img {
        width: 100%; max-width: 160px; height: 140px;
        object-fit: cover; border-radius: 12px; margin-bottom: 0.75rem;
      }
      .chat-panel {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 2px 16px rgba(80,0,0,0.08);
        padding: 1.25rem;
        margin-top: 1.5rem;
        display: none;
      }
      .chat-panel.open { display: block; }
      .chat-messages {
        max-height: 260px;
        overflow-y: auto;
        margin-bottom: 1rem;
        padding: 0.5rem;
        background: #fefae0;
        border-radius: 12px;
      }
      .chat-bubble {
        margin: 0.4rem 0;
        padding: 0.55rem 0.85rem;
        border-radius: 12px;
        max-width: 85%;
        font-size: 0.95rem;
      }
      .chat-bubble.buyer { background: #fff; margin-left: auto; border: 1px solid #eee; }
      .chat-bubble.artisan { background: #800000; color: #fff; }
      .btn-chat-store {
        background: #fff;
        color: #800000;
        font-weight: 700;
        border: none;
        border-radius: 30px;
        padding: 12px 28px;
      }
      .btn-chat-store:hover { background: #fbeee0; color: #600000; }
    </style>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;">
    <script src="js/local-database.js"></script>
    <script src="js/stores-database.js"></script>
    <script src="js/role-router.js"></script>
    <script src="js/products-database.js"></script>
    <script src="js/user-products-database.js"></script>
    <script src="js/services/platform-services.js"></script>
    <script src="js/i18n.js"></script>
    <script src="components/header-component.js"></script>
    <script src="components/header-user-component.js"></script>
    <script>window.renderHeader();</script>

    <main class="flex-grow-1" style="background:var(--light-bg,#FEFAE0);min-height:80vh;">
        <div class="container py-5">
            <div id="storeProfile" class="mb-4"></div>
            <div>
                <h3 class="mb-4" style="font-family:'Playfair Display',serif;" data-i18n="tienda_products_title">Productos de la tienda</h3>
                <div id="storeProducts" class="row products-grid g-4"></div>
            </div>
            <div id="storeChatPanel" class="chat-panel">
                <h5 class="mb-3" style="color:#800000;"><i class="fas fa-comments me-2"></i><span data-i18n="store_chat_title">Chat con el vendedor</span></h5>
                <div id="storeChatMessages" class="chat-messages"></div>
                <div class="input-group">
                    <input type="text" id="storeChatInput" class="form-control" placeholder="Escribe tu mensaje..." maxlength="500">
                    <button class="btn btn-primary" id="storeChatSend" type="button" style="background:#800000;border:none;">Enviar</button>
                </div>
            </div>
        </div>
    </main>

    <footer-component></footer-component>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="components/footer-component.js"></script>
    <script src="components/auth-modal.js"></script>
    <auth-modal></auth-modal>
    <script src="js/app-core.js"></script>
    <script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const storeId = params.get('id');
        const demoIdx = params.get('demo');
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        const DEMO_STORES = [
            { id: 'demo-0', ownerId: 1, ownerName: 'Ana Diaz', name: 'ArteMola (Guna)', location: 'Guna Yala', desc: 'Colorful molas and textile art from Guna Yala.', photo: '', products: [
                { name: 'Mola Textil 1', img: 'https://th.bing.com/th/id/R.f48328c70497e9faba341b77b688c328?rik=LvXXMXJcW5qA%2fQ&riu=http%3a%2f%2fwww.choosepanama.com%2fuploads%2f1%2f1%2f3%2f3%2f11332995%2fmola_orig.jpg&ehk=aU4u1cYEM04G13rFXT%2bNz8GtCBFsWwve8phN4w40Drg%3d&risl=&pid=ImgRaw&r=0' },
                { name: 'Mola Textil 2', img: 'https://i.etsystatic.com/26283200/r/il/8cb235/2802425507/il_fullxfull.2802425507_f84y.jpg' }
            ]},
            { id: 'demo-1', ownerId: 3, ownerName: 'Maria Gonzalez', name: 'Emberá Jewelry', location: 'Emberá', desc: 'Unique jewelry crafted by Emberá artisans.', photo: 'https://i.pinimg.com/736x/de/41/c8/de41c8e9fcf1c07187af9c8ade4a7a0a--colombia-gmail.jpg', products: [] }
        ];

        let store = null;
        let activeChat = null;

        if (storeId) {
            store = window.storesDB.getStoreById(storeId);
        } else if (demoIdx != null) {
            store = DEMO_STORES[Number(demoIdx)] || DEMO_STORES[0];
            store.isDemo = true;
        }

        if (!store) {
            document.getElementById('storeProfile').innerHTML = '<div class="alert alert-warning">Tienda no encontrada. <a href="explorar.html">Volver a Explorar</a></div>';
            return;
        }

        const profile = document.getElementById('storeProfile');
        const initials = (store.name || 'T').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
        profile.innerHTML = `
            <div class="store-hero-block d-flex flex-wrap align-items-center gap-4 justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    ${store.photo
                        ? `<img src="${esc(store.photo)}" alt="${esc(store.name)}">`
                        : `<div style="width:96px;height:96px;border-radius:50%;background:#fbeee0;color:#800000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem;border:3px solid #fbeee0;">${esc(initials)}</div>`}
                    <div>
                        <h1 style="font-family:'Playfair Display',serif;font-size:2rem;margin:0;">${esc(store.name)}</h1>
                        <p style="margin:6px 0 0;opacity:0.95;">${esc(store.location || '')}${store.ownerName ? ' · ' + esc(store.ownerName) : ''}</p>
                        ${store.desc ? `<p style="margin:8px 0 0;max-width:480px;">${esc(store.desc)}</p>` : ''}
                    </div>
                </div>
                <button type="button" class="btn btn-chat-store" id="openStoreChatBtn">
                    <i class="fas fa-comments me-2"></i>Escribir al vendedor
                </button>
            </div>
        `;

        // Products
        const productsEl = document.getElementById('storeProducts');
        let products = [];
        if (!store.isDemo && window.storesDB) {
            products = window.storesDB.getStoreProducts(store);
        }
        if (!products.length && store.products) {
            products = store.products.map((p, i) => ({
                id: 'demo-p-' + i,
                name: p.name,
                mainImage: p.img,
                price: null
            }));
        }
        // También productos del catálogo del artesano demo
        if (store.ownerId && window.userProductsDB) {
            const owned = window.userProductsDB.getUserOwnProducts(store.ownerId) || [];
            if (owned.length) products = owned;
        }

        if (!products.length) {
            productsEl.innerHTML = '<div class="col-12"><p class="text-muted">Esta tienda aún no tiene productos publicados.</p></div>';
        } else {
            productsEl.innerHTML = products.map(p => `
                <div class="col-md-4 col-sm-6">
                    <div class="product-card-tienda" ${p.id && !String(p.id).startsWith('demo') ? `onclick="location.href='product.html?id=${encodeURIComponent(p.id)}'"` : ''}>
                        <img src="${esc(p.mainImage || p.img || 'https://via.placeholder.com/200')}" alt="${esc(p.name)}">
                        <div class="product-title" style="color:#a22a22;font-weight:700;">${esc(p.name)}</div>
                        ${p.price != null ? `<div class="product-meta">$${Number(p.price).toFixed(2)}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderChatMessages() {
            const box = document.getElementById('storeChatMessages');
            if (!activeChat) { box.innerHTML = ''; return; }
            const msgs = window.PlatformServices.getChatMessages(activeChat.id);
            box.innerHTML = msgs.length
                ? msgs.map(m => `<div class="chat-bubble ${m.sender}">${esc(m.text)} <small style="opacity:0.7;display:block;">${esc(m.time)}</small></div>`).join('')
                : '<p class="text-muted mb-0 small">Escribe el primer mensaje al vendedor.</p>';
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('openStoreChatBtn').addEventListener('click', function () {
            const user = window.localDB.getCurrentUser();
            if (!user) {
                const authModal = document.querySelector('auth-modal');
                if (authModal) authModal.open('login');
                else alert('Inicia sesión para escribir al vendedor.');
                return;
            }
            if (user.id === store.ownerId) {
                alert('Esta es tu tienda. Responde a tus clientes desde tu perfil > Chat.');
                return;
            }
            activeChat = window.PlatformServices.startChatWithArtisan(
                store.ownerId,
                store.ownerName || store.name,
                store.photo || '',
                { storeId: store.id, storeName: store.name, buyerId: user.id, buyerName: user.name }
            );
            document.getElementById('storeChatPanel').classList.add('open');
            renderChatMessages();
            document.getElementById('storeChatInput').focus();
        });

        document.getElementById('storeChatSend').addEventListener('click', sendMsg);
        document.getElementById('storeChatInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') sendMsg();
        });

        function sendMsg() {
            const input = document.getElementById('storeChatInput');
            const text = input.value.trim();
            if (!text || !activeChat) return;
            window.PlatformServices.sendMessage(activeChat.id, text, 'buyer');
            input.value = '';
            renderChatMessages();
        }
    })();
    </script>
</body>
</html>
