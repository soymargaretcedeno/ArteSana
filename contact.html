<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | ArteSana</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Using theme variables from styles.css */
    body {
      background: var(--body-bg);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .contact-section {
      padding: 50px 0;
      min-height: 100vh;
    }
    .contact-container {
      display: flex;
      max-width: 1400px;
      margin: 0 auto;
      gap: 60px;
      align-items: flex-start;
      background: var(--body-bg);
      padding: 30px 0;
      transition: background-color 0.3s ease;
    }
    .contact-info {
      flex: 1;
      padding-left: 40px;
    }
    .contact-info h3 {
      color: var(--primary-color);
      font-size: 1.3rem;
      margin-bottom: 0.5em;
    }
    .contact-info h1 {
      color: var(--text-color);
      font-size: 2.8rem;
      margin-bottom: 0.3em;
      font-family: 'Playfair Display', serif;
    }
    .contact-info p {
      color: var(--text-color);
      opacity: 0.9;
      font-size: 1.5rem;
      margin-bottom: 2em;
    }
    .contact-method {
      display: flex;
      align-items: center;
      margin-bottom: 2em;
      gap: 18px;
      transition: color 0.3s ease;
    }
    .contact-icon {
      color: var(--primary-color);
      transition: color 0.3s ease;
    }
    .contact-method:last-child {
      margin-bottom: 0;
    }
    .contact-icon {
      font-size: 2.2rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .contact-label {
      font-size: 1.5rem;
      color: var(--text-color);
      font-weight: 500;
    }
    .contact-detail {
      font-size: 1.2rem;
      color: var(--text-color);
      opacity: 0.9;
    }
    .contact-form {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 40px;
    }
    .contact-form form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .form-row {
      display: flex;
      gap: 20px;
    }
    .contact-form input,
    .contact-form textarea {
      padding: 16px;
      font-size: 1.2rem;
      border-radius: 10px;
      border: 1px solid #e6e6c7;
      background: #fff;
      color: #575443;
      transition: border 0.2s;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      border: 1.5px solid #a22a22;
      outline: none;
    }
    .contact-form textarea {
      resize: vertical;
      min-height: 120px;
      max-height: 300px;
    }
    .contact-form button {
      background: var(--primary-color);
      color: var(--text-color);
      font-size: 2rem;
      border: none;
      border-radius: 30px;
      padding: 16px 40px;
      cursor: pointer;
      align-self: flex-end;
      transition: background 0.2s;
      font-family: 'Playfair Display', serif;
    }
    .contact-form button:hover {
      background: var(--primary-color-hover);
    }
    @media (max-width: 900px) {
      .contact-container {
        flex-direction: column;
        gap: 30px;
        padding: 0 10px;
      }
      .contact-info, .contact-form {
        padding: 0;
      }
      .contact-form button {
        width: 100%;
        align-self: stretch;
      }
    }
  </style>
</head>
<body>
    <script src="js/local-database.js"></script>
    <script src="js/i18n.js"></script>
    <script src="components/header-component.js"></script>
    <script src="components/header-user-component.js"></script>
    <script>window.renderHeader();</script>

  <main>
    <section class="contact-section">
      <div class="contact-container">
        <!-- Contact Info -->
        <div class="contact-info">
          <h3 data-i18n="contact_us">Contact Us</h3>
          <h1 data-i18n="contact_title">Have Any Questions?</h1>
          <p data-i18n="contact_lead">We're here to help. Contact us through any of these channels:</p>
          <div class="contact-method">
            <span class="contact-icon" style="color: #e94e77;">&#128222;</span>
            <div>
              <div class="contact-label" data-i18n="contact_call">Call Us</div>
              <div class="contact-detail">+507 6396-2388</div>
            </div>
          </div>
          <div class="contact-method">
            <span class="contact-icon" style="color: #6a8cff;">&#128231;</span>
            <div>
              <div class="contact-label" data-i18n="contact_email">Email Us</div>
              <div class="contact-detail">ArteSana919@gmail.com</div>
            </div>
          </div>
          <div class="contact-method">
            <span class="contact-icon" style="color: #e94e77;">&#128205;</span>
            <div>
              <div class="contact-label" data-i18n="contact_visit">Visit Us</div>
              <div class="contact-detail">123 Reform Ave, Panama City</div>
            </div>
          </div>
        </div>
        <!-- Contact Form -->
        <div class="contact-form">
          <form>
            <div class="form-row">
              <input type="text" placeholder="Your Name" required data-i18n="contact_name_placeholder">
              <input type="email" placeholder="Your Email" required data-i18n="contact_email_placeholder">
            </div>
            <input type="text" placeholder="Subject" required data-i18n="contact_subject_placeholder">
            <textarea placeholder="Your Message" rows="7" required data-i18n="contact_message_placeholder"></textarea>
            <button type="submit" data-i18n="send_message">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- CTA Section -->
  <cta-section 
    title="Ready to Connect with Panamanian Art?" 
    subtitle="Discover unique handcrafts or create your own artisan store for free. Join our community and share your art with the world!" 
    button-text="Create Your Free Store" 
    button-link="perfil.html#my-store-section"
    style="--primary-color:#E9EDC9; --mola-yellow:#A22A2A; --cream-white:#800000; --mola-red:#E5989B; --mola-orange:#FF9F1C;">
  </cta-section>
  <!-- Footer Component -->
  <footer-component></footer-component>

  <!-- Scripts al final del body para mejor rendimiento -->
  <script>
    // Función para corregir las rutas de las imágenes en el header
    function fixImagePaths() {
      const header = document.getElementById('header-component');
      if (header) {
        const images = header.getElementsByTagName('img');
        for (let img of images) {
          if (img.src.includes('assets/') && !img.src.startsWith('http')) {
            img.src = img.src.replace(/^.*assets\//, 'assets/');
          }
        }
      }
    }

    // Función para cambiar entre temas
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      // Aplicar el nuevo tema
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      
      // Actualizar el ícono
      const themeIcon = document.querySelector('.theme-toggle i');
      if (themeIcon) {
        themeIcon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
      }
    }
    
    // Hacer la función accesible globalmente
    window.toggleTheme = toggleTheme;
    
    // Función para aplicar el tema guardado
    function applySavedTheme() {
      // Obtener el tema guardado o usar 'light' como predeterminado
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      
      // Actualizar el ícono del botón de tema
      const themeIcon = document.querySelector('.theme-toggle i');
      if (themeIcon) {
        themeIcon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
      }
    }

    // Cargar componentes cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', function() {
      // Aplicar el tema guardado inmediatamente
      applySavedTheme();
      
      // Cargar header y footer
      fetch('components/header.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('header-component').innerHTML = html;
          fixImagePaths();
          
          // Configurar el ícono del botón de tema según el tema actual
          const currentTheme = document.documentElement.getAttribute('data-theme');
          const themeIcon = document.querySelector('.theme-toggle i');
          if (themeIcon) {
            themeIcon.className = currentTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
          }
        });
      
      fetch('components/footer.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('footer-component').innerHTML = html;
        });
    });
  </script>
  
  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Custom Components -->
  <script src="components/footer-component.js"></script>
  <script src="components/auth-modal.js"></script>
  <auth-modal></auth-modal>
  <script src="components/cta-section.js"></script>
</body>
</html>
